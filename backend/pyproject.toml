[project]
name = "filmiq-backend"
version = "0.2.0"
description = "FilmIQ acquisition-analysis API: LangGraph pipeline of deep-agent specialists + strategist"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API / server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    # Config / validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Agents
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "deepagents>=0.2.0",
    "langchain-tavily>=0.2.0",
    # RAG
    "langchain-community>=0.4.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0.0",
    # Web search fallback when TAVILY_API_KEY is unset
    "ddgs>=4.0.0",
    "langchain-groq>=1.0.0",
    "fastembed>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",  # FastAPI TestClient
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
